name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pull and rebuild on VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          # Covers the build plus up to 3h of waiting for translations to finish.
          command_timeout: 3h20m
          script: |
            set -euo pipefail
            cd /opt/nwn-translator
            git fetch origin
            git checkout -f -B main origin/main
            docker compose -f docker/docker-compose.yml build
            # Recreating the container kills running translations: wait for idle.
            bash scripts/wait_for_idle.sh
            docker compose -f docker/docker-compose.yml up -d
            docker compose -f docker/docker-compose.yml ps
