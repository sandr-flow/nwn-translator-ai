# Запуск из корня репозитория: docker compose -f docker/docker-compose.yml up --build
services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    expose:
      - "8000"
    environment:
      NWN_WEB_TASK_ROOT: /data/tasks
      # No CORS: nginx serves the SPA and proxies /api on the same origin.
      # Set NWN_WEB_CORS_ORIGINS to an explicit origin list only for cross-origin setups.
    volumes:
      - nwn_tasks:/data/tasks

  nginx:
    build:
      context: ..
      dockerfile: docker/Dockerfile.nginx
    ports:
      - "8080:80"
    depends_on:
      - app

volumes:
  nwn_tasks:
